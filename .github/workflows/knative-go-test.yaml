  # coverage upload as non-fatal. Primary fork CI honesty for this repo is in
  # functions.yaml (Codecov steps gated on secrets.CODECOV_TOKEN).
  test:
    uses: knative/actions/.github/workflows/reusable-go-test.yaml@main
