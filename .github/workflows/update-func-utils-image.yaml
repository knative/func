name: Update func-utils image to next release

# Main carries the func-utils image of the next minor release, so a branch
# release-X.Y cut from it already embeds func-utils:X.Y, and main's pushes
# have published it (see docs/func-utils-image.md). Cutting release-X.Y opens
# a PR that moves main to the next minor, X.(Y+1). Until it merges, main
# publishes no func-utils image.

on:
  # create has no branch filter; the job's if drops every other branch and tag.
  create:

permissions:
  contents: read

jobs:
  bump-utils-image:
    name: Bump Utils Image
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'release-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Move to Next Minor
        id: next
        # release-1.24 moves main from func-utils:1.24 to 1.25. If main is on
        # another minor (a re-cut or an old branch), sed changes nothing and no
        # PR opens.
        run: |
          cut="${GITHUB_REF_NAME#release-}"
          next="${cut%.*}.$(( ${cut#*.} + 1 ))"
          sed -i "s|func-utils:${cut}\"|func-utils:${next}\"|" pkg/version/version.go
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          commit-message: 'chore: bump func-utils image to ${{ steps.next.outputs.tag }} after new release branch cut'
          title: 'Bump func-utils image to ${{ steps.next.outputs.tag }}'
          body: |
            `${{ github.ref_name }}` was cut, so main moves on to the func-utils image of the next minor release, `ghcr.io/knative/func-utils:${{ steps.next.outputs.tag }}`. Until this merges, main publishes no func-utils image. See [docs/func-utils-image.md](https://github.com/${{ github.repository }}/blob/main/docs/func-utils-image.md).

            This PR was automatically generated by the [Update func-utils image workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          branch: bump-func-utils-${{ steps.next.outputs.tag }}
          delete-branch: true
          committer: Knative Automation <automation@knative.team>
          author: Knative Automation <automation@knative.team>
          assignees: gauron99, matejvasek, lkingland
          base: main
