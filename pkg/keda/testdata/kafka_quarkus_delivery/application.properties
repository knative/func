# Configuration for the TestInt_KafkaQuarkusDelivery handler fixture.
#
# Unlike the stock template, this exports no single named function: the handler
# declares two @Funq methods routed by CloudEvent type (@CloudEventMapping), so
# quarkus.funqy.export must be absent (setting it would restrict routing to one
# named function). The health paths are kept so the deployment's readiness and
# liveness probes resolve exactly as the stock template expects.
quarkus.smallrye-health.root-path=/health
quarkus.smallrye-health.liveness-path=liveness
quarkus.smallrye-health.readiness-path=readiness
